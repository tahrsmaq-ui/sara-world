    <style>
        :root {
            --bg-color: #fdfbf7;
            --card-bg: #ffffff;
            --text-color: #2c2c2c;
            --accent-color: #8b5a2b;
            --shadow: 0 10px 30px rgba(0,0,0,0.08);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Amiri', serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background-image: radial-gradient(#e0d7c6 0.8px, transparent 0.8px);
            background-size: 16px 16px;
        }

        .container {
            width: 100%;
            max-width: 680px;
            background: var(--card-bg);
            border-radius: 16px;
            box-shadow: var(--shadow);
            padding: 40px 30px;
            border: 1px solid #f0e6d2;
            position: relative;
            min-height: 480px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: all 0.3s ease;
        }

        .header-deco {
            text-align: center;
            font-size: 20px;
            color: var(--accent-color);
            margin-bottom: 15px;
        }

        .page-content {
            font-size: 1.25rem;
            line-height: 2.1;
            white-space: pre-line;
            text-align: justify;
            text-justify: inter-word;
            margin-bottom: 30px;
            color: #333;
            animation: fadeIn 0.5s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .footer-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid #f0e6d2;
            padding-top: 20px;
        }

        .btn {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 10px 22px;
            font-size: 1rem;
            font-family: 'Amiri', serif;
            border-radius: 25px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn:hover {
            background-color: #6d441f;
            transform: translateY(-2px);
        }

        .btn:disabled {
            background-color: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .page-indicator {
            font-family: 'Aref Ruqaa', serif;
            font-size: 1.1rem;
            color: #777;
        }

        /* لمسة زينة للبداية والنهاية */
        .decoration {
            text-align: center;
            margin-top: 10px;
            font-size: 18px;
            color: var(--accent-color);
        }
    </style>
</head>
